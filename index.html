<html lang="zh-TW">

    <!-- Google tag (gtag.js)：延後載入，避免佔用關鍵載入路徑。
         gtag() 呼叫會先進 dataLayer 佇列，待 gtag.js 載入後再處理，不漏事件。 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-CFNQQ2LKD5');

      (function () {
        function loadGtag() {
          if (window.__gtagLoaded) return;
          window.__gtagLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CFNQQ2LKD5';
          document.head.appendChild(s);
        }
        // 頁面載入完成後於閒置時載入；或使用者一互動就立即載入
        window.addEventListener('load', function () {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadGtag, { timeout: 5000 });
          } else {
            setTimeout(loadGtag, 3000);
          }
        });
        ['scroll', 'click', 'keydown', 'touchstart', 'mousemove'].forEach(
          function (ev) {
            window.addEventListener(ev, loadGtag, { once: true, passive: true });
          }
        );
      })();
    </script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              console.log('SW registered');
              // 檢查是否有更新，如果有則立刻強制接管
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (
                      installingWorker.state === 'installed' &&
                      navigator.serviceWorker.controller
                    ) {
                      window.location.reload();
                    }
                  };
                }
              };
            })
            .catch((err) => console.log('SW error:', err));
        });
      }
    </script>
